name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  GOWORK: "off"
  GOTOOLCHAIN: local

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26.8", "1.27.1"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"

      - name: Verify Dependencies
        run: go mod verify

      - name: Check Go formatting
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            printf 'Unformatted Go files:\n%s\n' "$files"
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.1 ./...

      - name: Run Tests
        run: go test -v -cover ./...

      - name: Run Race Detector (Linux & macOS)
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...

      - name: Offline Python tests (no network or credentials)
        run: python -m unittest discover -s tests -p "test_*.py" -v

  build-and-release:
    name: Build & Release Multi-Arch Binaries
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.26.8'
          cache: true

      - name: Run Source Vulnerability Scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Build Binaries
        run: |
          mkdir -p dist
          # Linux AMD64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/cypher-mcp-linux-amd64 .
          # Linux ARM64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/cypher-mcp-linux-arm64 .
          # macOS AMD64 (Intel)
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/cypher-mcp-darwin-amd64 .
          # macOS ARM64 (Apple Silicon)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/cypher-mcp-darwin-arm64 .
          # Windows AMD64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/cypher-mcp-windows-amd64.exe .

      - name: Scan Built Linux Binary for Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -mode=binary dist/cypher-mcp-linux-amd64

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum cypher-mcp-* > SHA256SUMS.txt

      - name: Verify Checksums
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            dist/*
          generate_release_notes: true