name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOWORK: "off"
  GOTOOLCHAIN: local

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26.8", "1.27.1"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
      - name: Verify dependencies
        run: go mod verify
      - name: Check Go formatting
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            printf 'Unformatted Go files:\n%s\n' "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        if: matrix.go == '1.26.8'
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.1 ./...
      - name: Go tests
        run: go test -count=1 -cover ./...
      - name: Go tests with race detector (Linux & macOS)
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
      - name: Go fuzz seed corpus tests
        run: go test -v -run="^Fuzz" .
      - name: Offline Python tests (no network or credentials)
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Verify tests leave tracked files unchanged
        run: git diff --exit-code

  vulnerabilities:
    name: Reachable vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "1.26.8"
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
